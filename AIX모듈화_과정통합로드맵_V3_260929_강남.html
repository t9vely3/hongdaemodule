    &lt;div class=&quot;banner&quot;&gt;&lt;b&gt;무엇이 바뀌나&lt;/b&gt; · 영상·유튜브·모션·에펙 계열 → &lt;b&gt;AI로 콘텐츠를 제작하고 채널을 운영하는 미디어 컨텐츠 스튜디오&lt;/b&gt;로 전환합니다.&lt;/div&gt;

    &lt;h3 class=&quot;mini&quot;&gt;왜 바꾸나&lt;/h3&gt;
    &lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;반복 단순 편집·기초 반복 실습은 AI 자동화로 대체 — 시간을 &lt;b&gt;실전 제작·완성도&lt;/b&gt;에 재배분&lt;/li&gt;
      &lt;li&gt;촬영 장비 없이도 &lt;b&gt;AI 툴만으로 콘텐츠를 생성·완성&lt;/b&gt;할 수 있게 됨 (진입장벽↓)&lt;/li&gt;
      &lt;li&gt;&quot;공통 파운데이션 → 필요한 미디어 모듈 선택 → 프로젝트반&quot;의 유연한 로드맵이 재등록·업셀에 유리&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h3 class=&quot;mini&quot;&gt;학습 동선&lt;/h3&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;div class=&quot;flow-col tool&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;1단계 · 파운데이션 (추천·권장)&lt;/div&gt;
        &lt;span class=&quot;chip&quot;&gt;AIX 코어 파운데이션 &lt;small&gt;개발 중&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;AIX 디자인 코어 &lt;small&gt;24H&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;AIX 포토 &lt;small&gt;24H&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;AIX 일러 &lt;small&gt;24H&lt;/small&gt;&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;flow-col mod&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;2단계 · 미디어 실무 모듈 (필요한 만큼 선택)&lt;/div&gt;
        &lt;span class=&quot;chip&quot;&gt;① AIX 마케팅영상 &lt;small&gt;24H&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;② 유튜브 올인원클래스 &lt;small&gt;32H&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;③ 실전 영상편집 클래스 &lt;small&gt;24H&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;④ AIX 2D영상디자인 &lt;small&gt;48H&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;⑤ AIX 3D영상디자인 &lt;small&gt;신설&lt;/small&gt;&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;flow-col proj&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;3단계&lt;/div&gt;
        &lt;span class=&quot;chip&quot;&gt;프로젝트반 (포폴반) &lt;small&gt;실전 통합 포트폴리오&lt;/small&gt;&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;flow-note&quot;&gt;※ 선수과목 없음 · 반복 기초는 AI 자동화로 축소 · 이수 시 실전 결과물(완성 영상·채널·광고 영상) 완성&lt;/p&gt;

    &lt;h3 class=&quot;mini&quot;&gt;핵심 메시지 3&lt;/h3&gt;
    &lt;div class=&quot;msg-grid&quot;&gt;
      &lt;div class=&quot;msg&quot;&gt;&lt;div class=&quot;n&quot;&gt;1&lt;/div&gt;&lt;h4&gt;AI로 빨라진 실전&lt;/h4&gt;&lt;p&gt;반복 편집·기초는 AI 자동화로 줄이고, 실전 콘텐츠 제작·완성도에 집중.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;msg&quot;&gt;&lt;div class=&quot;n&quot;&gt;2&lt;/div&gt;&lt;h4&gt;결과물 중심&lt;/h4&gt;&lt;p&gt;모듈마다 완성 영상 / 숏폼·채널 운영 / 광고 영상 등 실전 결과물로 마감.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;msg&quot;&gt;&lt;div class=&quot;n&quot;&gt;3&lt;/div&gt;&lt;h4&gt;제작 + 운영까지&lt;/h4&gt;&lt;p&gt;편집·모션을 넘어 유튜브 채널 운영·마케팅 영상까지 한 스튜디오에서.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 4 --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;4&lt;/div&gt;&lt;h2&gt;모듈별 상세 카드&lt;/h2&gt;&lt;span class=&quot;sub&quot;&gt;실무 모듈 4 + 파운데이션 4&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;cards&quot;&gt;

      &lt;div class=&quot;mcard type-mod&quot;&gt;
        &lt;div class=&quot;top&quot;&gt;
          &lt;div class=&quot;code&quot;&gt;MODULE ①&lt;/div&gt;
          &lt;h4&gt;AIX 마케팅영상 &lt;span class=&quot;hrs&quot;&gt;24H&lt;/span&gt;&lt;/h4&gt;
          &lt;p class=&quot;tagline&quot;&gt;촬영 장비 없이 AI 툴만으로 이미지·영상을 생성해 완성도 높은 웹용 영상 콘텐츠를 제작&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;body&quot;&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;대상&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;선수과목 없음 / 비전공자·입문자, 브랜드·마케팅 영상 지망&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;운영&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;24H · 3H×8D · 1개월&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;핵심&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;브랜드·광고 이해 → 소비자 심리·톤앤매너 → 광고 흐름·CTA → AI 광고 전략 → AI 키비주얼(Midjourney) → 광고 콘티 → 숏폼 광고 영상 제작(CapCut) → 발표&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;툴&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;&lt;span class=&quot;tool-pill ai&quot;&gt;ChatGPT&lt;/span&gt;&lt;span class=&quot;tool-pill ai&quot;&gt;Midjourney&lt;/span&gt;&lt;span class=&quot;tool-pill ai&quot;&gt;Canva&lt;/span&gt;&lt;span class=&quot;tool-pill ai&quot;&gt;Gamma&lt;/span&gt;&lt;span class=&quot;tool-pill ai&quot;&gt;CapCut&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;

          &lt;div class=&quot;from&quot;&gt;&lt;b&gt;기존:&lt;/b&gt; 유크리 기초·심화·컨텐츠크리에이터 → 통합·개편&lt;/div&gt;

  &lt;!-- 5 --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;5&lt;/div&gt;&lt;h2&gt;취업분야별 추천 조합&lt;/h2&gt;&lt;span class=&quot;sub&quot;&gt;수강 동선 예시&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;note-top&quot;&gt;&lt;b&gt;파운데이션(AIX 포토·일러 등)은 추천·권장&lt;/b&gt;, 그 위에 취업 방향에 맞는 미디어 모듈을 얹습니다.&lt;/div&gt;
    &lt;div class=&quot;tbl-scroll&quot;&gt;
      &lt;table class=&quot;combo&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;취업 방향&lt;/th&gt;&lt;th&gt;추천 조합&lt;/th&gt;&lt;th&gt;최종 결과물&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td class=&quot;course&quot;&gt;영상 편집자 / 콘텐츠 PD&lt;/td&gt;&lt;td class=&quot;path&quot;&gt;&lt;span class=&quot;mod&quot;&gt;실전 영상편집 클래스 + AIX 2D영상디자인&lt;/span&gt;&lt;/td&gt;&lt;td&gt;콘텐츠별 완성 영상 + 브랜드 모션&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;course&quot;&gt;모션 그래퍼&lt;/td&gt;&lt;td class=&quot;path&quot;&gt;&lt;span class=&quot;mod&quot;&gt;AIX 2D영상디자인&lt;/span&gt; (+실전 영상편집)&lt;/td&gt;&lt;td&gt;로고 애니메이션·브랜드 모션&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;course&quot;&gt;유튜브 크리에이터 / 채널 운영&lt;/td&gt;&lt;td class=&quot;path&quot;&gt;&lt;span class=&quot;mod&quot;&gt;유튜브 올인원클래스 + 실전 영상편집 클래스&lt;/span&gt;&lt;/td&gt;&lt;td&gt;숏폼·채널 운영 + 편집 역량&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;course&quot;&gt;콘텐츠 마케터 / 브랜드 홍보&lt;/td&gt;&lt;td class=&quot;path&quot;&gt;&lt;span class=&quot;mod&quot;&gt;AIX 마케팅영상 + 유튜브 올인원클래스&lt;/span&gt;&lt;/td&gt;&lt;td&gt;광고 영상 + 채널·캠페인 기획&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;course&quot;&gt;1인 미디어 / 부업&lt;/td&gt;&lt;td class=&quot;path&quot;&gt;&lt;span class=&quot;mod&quot;&gt;유튜브 올인원클래스 + AIX 마케팅영상&lt;/span&gt;&lt;/td&gt;&lt;td&gt;운영 채널 + AI 영상 콘텐츠&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;

    &lt;p class=&quot;after&quot;&gt;→ 어느 조합이든 파운데이션으로 기초를 다진 뒤 미디어 모듈을 선택하고, &lt;b&gt;프로젝트반(포폴반)&lt;/b&gt;에서 실전 통합 포트폴리오로 확장.&lt;/p&gt;

  &lt;section&gt;

&lt;header class=&quot;hero&quot;&gt;

    &lt;p&gt;기존 &#x27;패키지(원패스)형&#x27; 시각편집 과정을, 필요한 수업만 골라 듣고 매번 결과물이 남는 &lt;b&gt;모듈 선택형&lt;/b&gt; 체계로 개편합니다.&lt;/p&gt;

&lt;div class=&quot;wrap&quot;&gt;

  &lt;!-- 1 --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;1&lt;/div&gt;&lt;h2&gt;개편 배경 &amp;amp; 한 장 요약&lt;/h2&gt;&lt;/div&gt;
    &lt;div class=&quot;banner&quot;&gt;&lt;b&gt;무엇이 바뀌나&lt;/b&gt; · 원패스형 한 덩어리 과정 → &lt;b&gt;필요한 모듈만 골라 듣고, 취업 방향대로 조립하는 선택형 로드맵&lt;/b&gt;으로 전환합니다.&lt;/div&gt;

    &lt;h3 class=&quot;mini&quot;&gt;왜 바꾸나&lt;/h3&gt;
    &lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;원패스형은 진입장벽이 높고, 수강생이 자기 취업 목표와 무관한 부분까지 함께 들어야 함&lt;/li&gt;
      &lt;li&gt;AI 도구 도입으로 각 실무 영역이 &lt;b&gt;짧은 기간에 결과물까지&lt;/b&gt; 뽑아낼 수 있게 됨&lt;/li&gt;
      &lt;li&gt;&quot;AIX 포토·일러(선수) → 필요한 모듈 2~3개 선택 → 프로젝트반&quot;의 로드맵이 재등록·업셀에 유리&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h3 class=&quot;mini&quot;&gt;학습 동선&lt;/h3&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;div class=&quot;flow-col tool&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;1단계 · &lt;b&gt;AIX 포토 + AIX 일러 (선수 필수)&lt;/b&gt; / 그 외 추천·권장&lt;/div&gt;
        &lt;span class=&quot;chip&quot;&gt;AIX 코어 파운데이션 &lt;small&gt;개발 중&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;AIX 디자인 코어 &lt;small&gt;24H&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;AIX 포토 &lt;small&gt;24H&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;AIX 일러 &lt;small&gt;24H&lt;/small&gt;&lt;/span&gt;
      &lt;/div&gt;

          &lt;div class=&quot;code&quot;&gt;MODULE ②&lt;/div&gt;
          &lt;h4&gt;AIX 디지털출판실무 &lt;span class=&quot;hrs&quot;&gt;48H&lt;/span&gt;&lt;/h4&gt;
          &lt;p class=&quot;tagline&quot;&gt;인디자인으로 리플렛·브로슈어·매거진을 기획부터 인쇄·전자책까지 완성하는 편집출판 실무&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;body&quot;&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;대상&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;AIX 포토 &lt;b&gt;선수 필수&lt;/b&gt; &lt;small&gt;(인디자인 커리큘럼 특성상 포토샵 선수강 불가피 — 강사 요청)&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;운영&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;48H · 3H×8D×2M · 2개월 / 격일반(2H×16) 또는 금요반(4H×8)&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;핵심&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;1단계 인디자인 툴 기초(도큐먼트·텍스트/이미지 프레임·스타일 시스템·그리드·마스터페이지) 24H → 2단계 개인 프로젝트(리플렛/브로슈어/매거진 택1 → 기획·인쇄데이터·전자책 변환) 24H&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;툴&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;&lt;span class=&quot;tool-pill&quot;&gt;InDesign&lt;/span&gt;&lt;span class=&quot;tool-pill ai&quot;&gt;GPT&lt;/span&gt;&lt;span class=&quot;tool-pill ai&quot;&gt;미드저니&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;result-box&quot;&gt;&lt;b&gt;결과물&lt;/b&gt; · 리플렛·브로슈어·매거진 중 선택 제작한 편집출판물 (인터랙티브 PDF·전자책 변환 포함)&lt;/div&gt;
          &lt;div class=&quot;from&quot;&gt;&lt;b&gt;기존:&lt;/b&gt; 인디자인 → 개편&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;mcard type-mod&quot;&gt;
        &lt;div class=&quot;top&quot;&gt;
          &lt;div class=&quot;code&quot;&gt;MODULE ③&lt;/div&gt;
          &lt;h4&gt;AIX 패키지MD &lt;span class=&quot;hrs&quot;&gt;48H&lt;/span&gt;&lt;/h4&gt;
          &lt;p class=&quot;tagline&quot;&gt;도면(칼선) 설계부터 입체 패키지·굿즈까지, 실제 상품 박스와 트렌디한 굿즈를 직접 제작&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;body&quot;&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;대상&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;AIX 포토 + AIX 일러 선수 필수 / 숙련도에 따라 분반 운영&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;운영&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;48H · 3H×8D×2M · 2개월 / Day1~2 공통 이론·기획 → Day3~5 분반 → Day6~16 합류 실무&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;핵심&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;도면·칼선 → 기본·응용 박스 구조 설계 → 패키지 그래픽 → 인쇄 데이터 → 목업 → 굿즈 기획·평면/입체 굿즈 → 통합 프로젝트&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;툴&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;&lt;span class=&quot;tool-pill&quot;&gt;Illustrator&lt;/span&gt;&lt;span class=&quot;tool-pill&quot;&gt;Photoshop&lt;/span&gt;&lt;span class=&quot;tool-pill ai&quot;&gt;GPT&lt;/span&gt;&lt;span class=&quot;tool-pill ai&quot;&gt;미드저니&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;result-box&quot;&gt;&lt;b&gt;결과물&lt;/b&gt; · 입체 상품 박스(패키지) + 브랜드 굿즈&lt;/div&gt;
          &lt;div class=&quot;from&quot;&gt;&lt;b&gt;기존:&lt;/b&gt; 패키지 MD → 개편&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;mcard type-mod&quot;&gt;
        &lt;div class=&quot;top&quot;&gt;
          &lt;div class=&quot;code&quot;&gt;MODULE ④&lt;/div&gt;
          &lt;h4&gt;AIX 브랜딩디자인실무 &lt;span class=&quot;hrs&quot;&gt;48H&lt;/span&gt;&lt;/h4&gt;
          &lt;p class=&quot;tagline&quot;&gt;브랜드 로고(BI/CI)를 개발하고 전체 가이드북까지 만드는 브랜드 비주얼 종합 실무&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;body&quot;&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;대상&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;AIX 포토 + AIX 일러 선수 필수 / 숙련도에 따라 분반 운영 (패키지MD 이수자 포함)&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;운영&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;48H · 3H×8D×2M · 2개월 / Day1~2 공통 이론·기획 → Day3~5 분반 → Day6~16 합류 실무&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;핵심&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;BI/CI 이론 → 로고 스케치·벡터화·로고 시스템 → 컬러·타이포 시스템 → 그래픽 모티프 → 응용 어플리케이션(오프라인/디지털) → 브랜드 가이드북 → 최종 목업·발표&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;툴&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;&lt;span class=&quot;tool-pill&quot;&gt;Illustrator&lt;/span&gt;&lt;span class=&quot;tool-pill&quot;&gt;Photoshop&lt;/span&gt;&lt;span class=&quot;tool-pill ai&quot;&gt;GPT&lt;/span&gt;&lt;span class=&quot;tool-pill ai&quot;&gt;미드저니&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;result-box&quot;&gt;&lt;b&gt;결과물&lt;/b&gt; · BI 로고 + 컬러·서체 가이드 + 응용 어플리케이션(브랜드 비주얼 가이드북)&lt;/div&gt;
          &lt;div class=&quot;from&quot;&gt;&lt;b&gt;기존:&lt;/b&gt; 브랜딩 → 개편&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;mcard type-tool&quot;&gt;
        &lt;div class=&quot;top&quot;&gt;
          &lt;div class=&quot;code&quot;&gt;FOUNDATION · &lt;span style=&quot;color:var(--nb-blue)&quot;&gt;추천·권장&lt;/span&gt;&lt;/div&gt;
          &lt;h4&gt;AIX 코어 파운데이션 &lt;span class=&quot;hrs&quot;&gt;개발 중&lt;/span&gt;&lt;/h4&gt;
          &lt;p class=&quot;tagline&quot;&gt;실무 모듈 진입 전 갖추면 좋은 AI 활용 공통 기초 (권장)&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;body&quot;&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;대상&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;선수과목 없음 / 전 과정 공통 권장&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;운영&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;개발 중 · AI 3대장 책 기반 신규 커리큘럼 · 개발 전까지 기존 AI 프롬프트 엔지니어링으로 대체 운영&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;result-box&quot;&gt;&lt;b&gt;결과물&lt;/b&gt; · AI 도구 활용 기초 감각&lt;/div&gt;
          &lt;div class=&quot;todo&quot;&gt;※ 시수·상세 커리큘럼 별도 확정 필요&lt;/div&gt;
          &lt;div class=&quot;from&quot;&gt;&lt;b&gt;성격:&lt;/b&gt; 신설 · 추천·권장&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;mcard type-tool&quot;&gt;
        &lt;div class=&quot;top&quot;&gt;
          &lt;div class=&quot;code&quot;&gt;FOUNDATION · &lt;span style=&quot;color:var(--nb-blue)&quot;&gt;추천·권장&lt;/span&gt;&lt;/div&gt;
          &lt;h4&gt;AIX 디자인 코어 &lt;span class=&quot;hrs&quot;&gt;24H&lt;/span&gt;&lt;/h4&gt;
          &lt;p class=&quot;tagline&quot;&gt;프로그램 기능보다 디자인 핵심 원리·시각적 판단력을 먼저 익히는 공통 입문 (AI 결과를 판단·수정하는 눈)&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;body&quot;&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;대상&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;선수학습 없음 / 비전공자·입문자, 구성이 어려운 학습자&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;운영&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;24H · 3H×8D · 1개월&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;핵심&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;디자인 보는 눈 → 레이아웃·여백 → 타이포그래피 → 컬러 → 이미지 구성 → 콜라주 → 발상·비주얼 콘셉트&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;result-box&quot;&gt;&lt;b&gt;결과물&lt;/b&gt; · 시각요소 분석보드·정보형 레이아웃·개인 콘셉트보드 등&lt;/div&gt;
          &lt;div class=&quot;from&quot;&gt;&lt;b&gt;성격:&lt;/b&gt; 신설 · 추천·권장&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;mcard type-tool&quot;&gt;
        &lt;div class=&quot;top&quot;&gt;
          &lt;div class=&quot;code&quot;&gt;FOUNDATION · &lt;span style=&quot;color:var(--nb-blue)&quot;&gt;추천·권장&lt;/span&gt;&lt;/div&gt;
          &lt;h4&gt;AIX 포토 &lt;span class=&quot;hrs&quot;&gt;24H&lt;/span&gt;&lt;/h4&gt;
          &lt;p class=&quot;tagline&quot;&gt;기존 포토샵 + 포토웍스를 하나로 묶은 AI 활용 이미지 편집 기초&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;body&quot;&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;대상&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;선수과목 없음&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;운영&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;24H · 3H×8D · 1개월&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;result-box&quot;&gt;&lt;b&gt;결과물&lt;/b&gt; · 이미지 보정·합성·목업 등 기초 실습 결과물&lt;/div&gt;
          &lt;div class=&quot;todo&quot;&gt;※ 상세 차시 커리큘럼 별도 확정 필요 (포토샵·포토웍스 통합)&lt;/div&gt;
          &lt;div class=&quot;from&quot;&gt;&lt;b&gt;기존:&lt;/b&gt; 포토샵 + 포토웍스 → 통합·신설&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;mcard type-tool&quot;&gt;
        &lt;div class=&quot;top&quot;&gt;
          &lt;div class=&quot;code&quot;&gt;FOUNDATION · &lt;span style=&quot;color:var(--nb-blue)&quot;&gt;추천·권장&lt;/span&gt;&lt;/div&gt;
          &lt;h4&gt;AIX 일러 &lt;span class=&quot;hrs&quot;&gt;24H&lt;/span&gt;&lt;/h4&gt;
          &lt;p class=&quot;tagline&quot;&gt;기존 일러스트 + 디테일 일러스트를 하나로 묶은 AI 활용 벡터 그래픽 기초&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;body&quot;&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;대상&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;선수과목 없음&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;운영&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;24H · 3H×8D · 1개월&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;result-box&quot;&gt;&lt;b&gt;결과물&lt;/b&gt; · 벡터 아트웍·아이콘·심볼 등 기초 실습 결과물&lt;/div&gt;
          &lt;div class=&quot;todo&quot;&gt;※ 상세 차시 커리큘럼 별도 확정 필요 (일러스트·디테일 일러스트 통합)&lt;/div&gt;
          &lt;div class=&quot;from&quot;&gt;&lt;b&gt;기존:&lt;/b&gt; 일러스트 + 디테일 일러스트 → 통합·신설&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 5 --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;5&lt;/div&gt;&lt;h2&gt;취업분야별 추천 조합&lt;/h2&gt;&lt;span class=&quot;sub&quot;&gt;수강 동선 예시&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;note-top&quot;&gt;&lt;b&gt;파운데이션 4종(AIX 코어 · AIX 디자인 코어 · AIX 포토 · AIX 일러)은 선수과목은 아니지만 모든 조합에 추천·권장&lt;/b&gt;되며, 그 위에 취업 방향에 맞는 실무 모듈을 얹습니다.&lt;/div&gt;
    &lt;div class=&quot;tbl-scroll&quot;&gt;
      &lt;table class=&quot;combo&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;취업 방향&lt;/th&gt;&lt;th&gt;추천 조합&lt;/th&gt;&lt;th&gt;최종 결과물&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td class=&quot;course&quot;&gt;SNS·마케팅 / 커머스&lt;/td&gt;&lt;td class=&quot;path&quot;&gt;&lt;span class=&quot;base&quot;&gt;AIX 포토 + AIX 일러&lt;/span&gt; + &lt;span class=&quot;mod&quot;&gt;① 마케팅 클래스 + ④ 브랜딩&lt;/span&gt;&lt;/td&gt;&lt;td&gt;브랜드 아이덴티티 + SNS·판매 콘텐츠 풀세트&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;course&quot;&gt;편집·출판 디자이너&lt;/td&gt;&lt;td class=&quot;path&quot;&gt;&lt;span class=&quot;base&quot;&gt;AIX 포토 + AIX 일러&lt;/span&gt; + &lt;span class=&quot;mod&quot;&gt;② 디지털 출판 + ④ 브랜딩&lt;/span&gt;&lt;/td&gt;&lt;td&gt;편집출판물 + 브랜드 가이드&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;course&quot;&gt;패키지·MD / 제품 디자인&lt;/td&gt;&lt;td class=&quot;path&quot;&gt;&lt;span class=&quot;base&quot;&gt;AIX 포토 + AIX 일러&lt;/span&gt; + &lt;span class=&quot;mod&quot;&gt;③ 패키지&amp;amp;굿즈 + ④ 브랜딩&lt;/span&gt;&lt;/td&gt;&lt;td&gt;패키지 + 굿즈 + 브랜드 시스템&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;course&quot;&gt;종합 그래픽 디자이너&lt;/td&gt;&lt;td class=&quot;path&quot;&gt;&lt;span class=&quot;base&quot;&gt;AIX 포토 + AIX 일러&lt;/span&gt; + &lt;span class=&quot;mod&quot;&gt;실무 모듈 3개(브랜딩·패키지·출판)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;로고·편집·패키지 통합 포트폴리오&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;p class=&quot;after&quot;&gt;→ 어느 조합이든 &lt;b&gt;AIX 포토·일러스트로 툴 기초를 다진 뒤 실무 모듈 2~3개 이수 후, 프로젝트반(포폴반)&lt;/b&gt;에서 실전 통합 포트폴리오로 확장.&lt;/p&gt;
  &lt;/section&gt;

  &lt;!-- 6 --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;6&lt;/div&gt;&lt;h2&gt;기대효과 &amp;amp; 운영 포인트&lt;/h2&gt;&lt;/div&gt;
    &lt;div class=&quot;eff-grid&quot;&gt;
      &lt;div class=&quot;eff&quot;&gt;&lt;div class=&quot;ic&quot;&gt;🚪&lt;/div&gt;&lt;h5&gt;진입장벽 ↓&lt;/h5&gt;&lt;p&gt;AIX 포토·일러 선수 이수 후, 원하는 실무 모듈부터 시작&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;wrap&quot;&gt;

  &lt;!-- 1 --&gt;

    &lt;div class=&quot;banner&quot;&gt;&lt;b&gt;무엇이 바뀌나&lt;/b&gt; · 순차형 문법 과정(HTML/CSS/JS·웹1·2·3) → &lt;b&gt;AI로 설계·구현·출시까지 완주하는 모듈 선택형&lt;/b&gt;으로 전환합니다.&lt;/div&gt;
    &lt;div class=&quot;concept&quot;&gt;Figma로 설계하고, Claude Code로 구현하고, 실제 URL로 출시한다.&lt;/div&gt;

    &lt;h3 class=&quot;mini&quot;&gt;왜 바꾸나&lt;/h3&gt;
    &lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;선행 문법수업 방식은 진입장벽이 높고 완주·취업 연결이 약함 — AI 시대엔 &lt;b&gt;&quot;만들며 배우는&quot;&lt;/b&gt; 방식이 효과적&lt;/li&gt;
      &lt;li&gt;AI 도구로 디자인·코딩·업무자동화·창업까지 &lt;b&gt;짧은 기간에 실제 결과물(출시 서비스·자동화 시스템·스토어)&lt;/b&gt;을 낼 수 있음&lt;/li&gt;
      &lt;li&gt;&quot;선수과목 없이 → 필요한 모듈 선택 → 프로젝트반&quot;의 유연한 로드맵이 재등록·업셀에 유리&lt;/li&gt;

        &lt;span class=&quot;chip&quot;&gt;AIX 포토 &lt;small&gt;24H&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;AIX 일러 &lt;small&gt;24H&lt;/small&gt;&lt;/span&gt;

&lt;style&gt;
  :root{
    /* Nova v6 tokens */
    --nb-navy:#005192; --nb-navy-d:#003D72; --nb-navy-x:#002952;

  .sec-head h2{margin:0; font-size:22px; font-weight:900; letter-spacing:-.025em; color:var(--nb-navy-d);}
  .sec-head .sub{margin-left:auto; font-size:12.5px; color:var(--nb-muted); font-weight:700;}

  p{margin:0 0 12px;}
  .hl{color:var(--nb-blue); font-weight:800;}
  .banner{background:var(--blue-s); border:1px solid var(--blue-line); border-radius:var(--r-md);

  .banner b{color:var(--nb-navy);}
  ul.clean{list-style:none; padding:0; margin:0 0 8px;}
  ul.clean li{position:relative; padding:7px 0 7px 24px; color:var(--nb-text); font-size:14.5px;}
  ul.clean li::before{content:&quot;&quot;; position:absolute; left:2px; top:14px; width:9px; height:9px;

  .flow-col{border-radius:var(--r-md); padding:17px 15px; border:1px solid var(--nb-line); background:var(--nb-bg-soft);}
  .flow-col .step{font-size:11.5px; font-weight:800; letter-spacing:.05em; color:var(--nb-muted); margin-bottom:11px;}
  .flow-col.tool{background:var(--navy-s); border-color:var(--navy-line);}
  .flow-col.mod{background:var(--blue-s); border-color:var(--blue-line);}

  .arrow-cell{color:var(--nb-blue); text-align:center; font-weight:800;}
  .sumline{background:var(--navy-s); border-left:4px solid var(--nb-gold); border-radius:0 12px 12px 0;
    padding:13px 17px; margin-top:14px; font-size:14px; color:var(--nb-text);}
  .sumline b{color:var(--nb-navy-d);}
  .ai-box{background:var(--blue-s); border:1px solid var(--blue-line); border-radius:var(--r-lg); padding:22px 22px 17px; margin-top:20px;}
  .ai-box .tag{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:900; letter-spacing:.02em;
    color:var(--nb-gold-t); background:var(--nb-gold-s); border:1px solid rgba(246,171,0,.4); padding:6px 13px; border-radius:var(--pill); margin-bottom:13px;}

  .mcard h4 .hrs{font-size:12.5px; font-weight:900; color:#fff; background:linear-gradient(140deg,#005192,#0085CD); padding:3px 11px; border-radius:var(--pill); letter-spacing:0;}

  .result-box b{color:var(--nb-gold-t); font-weight:800;}

  .note-top b{color:var(--nb-navy-d);}
  .after{margin-top:14px; font-size:14px; color:var(--nb-text);}

  .eff-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-top:6px;}
  .eff{border:1px solid var(--nb-line); border-radius:var(--r-md); padding:17px 13px; text-align:center; background:var(--nb-bg-soft);}

  .appendix{background:var(--nb-gold-s); border:1px solid rgba(246,171,0,.35);}

  .appendix h2{color:var(--nb-gold-t);}
  .chk{list-style:none; padding:0; margin:6px 0 0;}

  .chk li:last-child{border-bottom:none;}
  .chk li::before{content:&quot;☐&quot;; position:absolute; left:4px; top:8px; font-size:15px; color:var(--nb-gold-d);}
  footer{text-align:center; color:var(--nb-muted); font-size:12px; margin-top:34px; font-weight:600;}

&lt;body&gt;

&lt;header class=&quot;hero&quot;&gt;
  &lt;div class=&quot;hero-in&quot;&gt;
    &lt;span class=&quot;kicker&quot;&gt;교육과정 개편 · AIX강남 스페이스&lt;/span&gt;
    &lt;h1&gt;스페이스 모듈 개편 — 사업부 설명자료&lt;/h1&gt;
    &lt;p&gt;기존 &#x27;단일 진급형&#x27; 인테리어/건축 로드맵을, AI 도구를 결합해 &lt;b&gt;과목마다 실무 납품 결과물이 남는 모듈형 4과목 체계&lt;/b&gt;로 개편합니다.&lt;/p&gt;
    &lt;div class=&quot;hero-meta&quot;&gt;
      &lt;span&gt;파운데이션 4(추천·권장) · 실무 모듈 4 · 프로젝트반&lt;/span&gt;
      &lt;span&gt;공통 파운데이션은 추천·권장 (필수 아님)&lt;/span&gt;
      &lt;span&gt;각 과목 이수 시 납품 수준 결과물 완성&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/header&gt;

&lt;div class=&quot;wrap&quot;&gt;

  &lt;!-- ========== 1. 개편 배경 &amp; 한 장 요약 ========== --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;1&lt;/div&gt;&lt;h2&gt;개편 배경 &amp;amp; 한 장 요약&lt;/h2&gt;&lt;/div&gt;
    &lt;div class=&quot;banner&quot;&gt;&lt;b&gt;무엇이 바뀌나&lt;/b&gt; · 기존 진급형(스케치→캐드→스케치업→맥스→포폴) 인테리어 로드맵을, AI를 결합해 &lt;b&gt;과목마다 결과물이 남는 모듈형 4과목 체계&lt;/b&gt;(공통 파운데이션 + 전공 과목 1~4)로 개편합니다.&lt;/div&gt;

    &lt;h3 class=&quot;mini&quot;&gt;왜 바꾸나&lt;/h3&gt;
    &lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;기존 로드맵은 진급 단계가 길고, 완주까지 결과물을 손에 쥐기 어려워 &lt;b&gt;중도이탈·상담 이탈&lt;/b&gt;이 큼&lt;/li&gt;
      &lt;li&gt;AI 도구(공간배치·컨셉 이미지·렌더 보정·수량 산출 자동화) 도입으로 &lt;b&gt;완전 초보자도 각 과목 종료 시 클라이언트 납품 수준 결과물&lt;/b&gt;을 완성&lt;/li&gt;
      &lt;li&gt;&quot;공통 파운데이션 → 필요한 과목 조합(도면·렌더·BIM·VR) → 프로젝트반&quot;으로 이어지는 로드맵이 &lt;b&gt;취업 방향별 맞춤 수강·재등록·업셀&lt;/b&gt;에 유리&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h3 class=&quot;mini&quot;&gt;학습 동선&lt;/h3&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;div class=&quot;flow-col tool&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;1단계 · 파운데이션 (추천·권장)&lt;/div&gt;
        &lt;span class=&quot;chip&quot;&gt;AIX 코어 파운데이션 &lt;small&gt;개발 중&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;AIX 디자인 코어 &lt;small&gt;24H&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;AIX 포토 &lt;small&gt;24H&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;AIX 일러 &lt;small&gt;24H&lt;/small&gt;&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;flow-col mod&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;2단계 · 실무 모듈 (취업방향대로 선택)&lt;/div&gt;
        &lt;span class=&quot;chip&quot;&gt;① AIX 공간기획&amp;amp;도면 &lt;small&gt;48H&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;② AIX 3D인테리어 &lt;small&gt;90H&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;③ BIM 기초 &amp;amp; AIX 활용 &lt;small&gt;48H&lt;/small&gt;&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;④ AIX 공간VR시각화 &lt;small&gt;48H&lt;/small&gt;&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;flow-col proj&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;3단계&lt;/div&gt;
        &lt;span class=&quot;chip&quot;&gt;인테리어 프로젝트반 (포폴반) &lt;small&gt;실전 통합 포트폴리오&lt;/small&gt;&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;flow-note&quot;&gt;※ 전공 4과목은 완전 초보자 기준 설계 · 공통 파운데이션은 필수 아닌 추천/권장 · ④는 ② 필수 선이수&lt;/p&gt;

    &lt;h3 class=&quot;mini&quot;&gt;핵심 메시지 3&lt;/h3&gt;
    &lt;div class=&quot;msg-grid&quot;&gt;
      &lt;div class=&quot;msg&quot;&gt;&lt;div class=&quot;n&quot;&gt;1&lt;/div&gt;&lt;h4&gt;완전 초보자부터 시작&lt;/h4&gt;&lt;p&gt;전공 4과목 모두 관련 프로그램(AutoCAD·SketchUp·3ds Max·Revit·VR) 미경험 기준으로 재설계, 인터페이스 적용부터 단계적으로 구성&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;msg&quot;&gt;&lt;div class=&quot;n&quot;&gt;2&lt;/div&gt;&lt;h4&gt;과목마다 납품 결과물&lt;/h4&gt;&lt;p&gt;각 과목 마지막 Live Brief에서 도면세트·렌더링 포트폴리오·BIM 납품 패키지·VR 투어 등 실무 산출물 완성 → 중도이탈 방지&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;msg&quot;&gt;&lt;div class=&quot;n&quot;&gt;3&lt;/div&gt;&lt;h4&gt;취업 방향대로 조립&lt;/h4&gt;&lt;p&gt;렌더러·BIM 모델러·VR 프리랜서·CAD 설계자 등 목표에 맞춰 과목을 골라 수강, 프로젝트반으로 연결&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ========== 2. 전체 모듈 맵 ========== --&gt;
  &lt;section&gt;

          &lt;tr&gt;&lt;td&gt;파운데이션&lt;/td&gt;&lt;td class=&quot;course&quot;&gt;AIX 디자인 코어&lt;/td&gt;&lt;td&gt;24H&lt;br&gt;&lt;small&gt;2H×8D&lt;/small&gt;&lt;/td&gt;&lt;td&gt;1개월&lt;br&gt;&lt;span class=&quot;badge b-rec&quot;&gt;추천·권장&lt;/span&gt;&lt;/td&gt;&lt;td&gt;개인 콘셉트보드 (+타이포·컬러·드로잉·콜라주 결과물)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;badge b-reg&quot;&gt;정규화(공통 기초)&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;파운데이션&lt;/td&gt;&lt;td class=&quot;course&quot;&gt;AIX 포토&lt;/td&gt;&lt;td&gt;24H&lt;br&gt;&lt;small&gt;3H×8D&lt;/small&gt;&lt;/td&gt;&lt;td&gt;1개월&lt;br&gt;&lt;span class=&quot;badge b-rec&quot;&gt;추천·권장&lt;/span&gt;&lt;/td&gt;&lt;td&gt;이미지 편집·합성·보정 기초&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;badge b-new&quot;&gt;신설·통합&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;파운데이션&lt;/td&gt;&lt;td class=&quot;course&quot;&gt;AIX 일러&lt;/td&gt;&lt;td&gt;24H&lt;br&gt;&lt;small&gt;3H×8D&lt;/small&gt;&lt;/td&gt;&lt;td&gt;1개월&lt;br&gt;&lt;span class=&quot;badge b-rec&quot;&gt;추천·권장&lt;/span&gt;&lt;/td&gt;&lt;td&gt;벡터 그래픽·아트웍 기초&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;badge b-new&quot;&gt;신설·통합&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;실무 ①&lt;/td&gt;&lt;td class=&quot;course&quot;&gt;AIX 공간기획&amp;amp;도면&lt;/td&gt;&lt;td&gt;48H&lt;br&gt;&lt;small&gt;3H×8D×2M&lt;/small&gt;&lt;/td&gt;&lt;td&gt;2개월&lt;/td&gt;&lt;td&gt;AutoCAD 도면세트(평면·입면·천장) + AI 컨셉 이미지 + 인테리어 기획서·제안 PPT&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;badge b-remake&quot;&gt;개편·확대&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;실무 ②&lt;/td&gt;&lt;td class=&quot;course&quot;&gt;AIX 3D인테리어&lt;/td&gt;&lt;td&gt;90H&lt;br&gt;&lt;small&gt;3H×10D×3M&lt;/small&gt;&lt;/td&gt;&lt;td&gt;3개월&lt;/td&gt;&lt;td&gt;SketchUp·3ds Max 모델링 + 고품질 렌더링 포트폴리오(주거 3컷+상업 2컷)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;badge b-new&quot;&gt;통합·확대&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;실무 ③&lt;/td&gt;&lt;td class=&quot;course&quot;&gt;BIM 기초 &amp;amp; AIX 활용&lt;/td&gt;&lt;td&gt;48H&lt;br&gt;&lt;small&gt;3H×8D×2M&lt;/small&gt;&lt;/td&gt;&lt;td&gt;2개월&lt;/td&gt;&lt;td&gt;소형 단독주택/상가 BIM 모델 + 도면세트 + 수량 산출표&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;badge b-remake&quot;&gt;개편&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;

    &lt;div class=&quot;ai-box&quot;&gt;
      &lt;span class=&quot;tag&quot;&gt;◆ 공통 · AI 활용 (핵심 차별점)&lt;/span&gt;
      &lt;p&gt;전공 4과목은 전문 소프트웨어(AutoCAD·SketchUp·3ds Max·Revit·VR) 위에 &lt;b class=&quot;hl-ai&quot;&gt;수업 연관 AI 도구를 공통으로 결합&lt;/b&gt;합니다.&lt;/p&gt;
      &lt;div class=&quot;ai-tools&quot;&gt;
        &lt;div class=&quot;ai-tool&quot;&gt;&lt;b&gt;ChatGPT · Claude&lt;/b&gt;&lt;span&gt;공간 기획 브리프 분석 · 렌더링 보정 프롬프트 · 아이디어/텍스트 작업&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ai-tool&quot;&gt;&lt;b&gt;Midjourney · Interior AI · Maket.ai&lt;/b&gt;&lt;span&gt;인테리어 컨셉 이미지 · 무드보드 · 평면 초안 자동 생성&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ai-tool&quot;&gt;&lt;b&gt;Autodesk Forma · Dynamo&lt;/b&gt;&lt;span&gt;BIM 일조·에너지 분석 · 반복 배치·수량 산출 자동화&lt;/span&gt;&lt;/div&gt;

      &lt;/div&gt;
      &lt;p class=&quot;ai-concl&quot;&gt;→ AI로 기획·생성·자동화하고, 전문 툴로 도면·모델·렌더를 완성한다.&lt;/p&gt;
      &lt;p class=&quot;ai-foot&quot;&gt;※ 파운데이션(AIX 코어·AIX 디자인)은 필수가 아닌 추천/권장 · ④는 ② 필수 선이수&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ========== 3. 기존 → 신규 전환 매핑 ========== --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;3&lt;/div&gt;&lt;h2&gt;기존 수업 → 신규 전환 매핑&lt;/h2&gt;&lt;span class=&quot;sub&quot;&gt;사업부 최다 관심&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl-scroll&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;기존 수업&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;신규 과정&lt;/th&gt;&lt;th&gt;전환 유형&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;

    &lt;div class=&quot;sumline&quot;&gt;기존 인테리어/건축 라인의 도면·3D·렌더·BIM·AI 수업은 손실 없이 4개 신규 과목으로 흡수·재배치되고, 스케치업·맥스·엔스케이프 3개 영역은 하나의 90H 렌더링 과목으로 통합됩니다. 자격증·기계 라인은 별도 라인으로 존치·병행 운영합니다. → &lt;b&gt;콘텐츠·강사 자원의 손실 없이 재구성&lt;/b&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ========== 4. 모듈별 상세 카드 ========== --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;4&lt;/div&gt;&lt;h2&gt;모듈별 상세 카드&lt;/h2&gt;&lt;span class=&quot;sub&quot;&gt;실무 모듈 4 + 파운데이션 4&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;cards&quot;&gt;

      &lt;!-- 실무 모듈 ① --&gt;
      &lt;div class=&quot;mcard type-mod&quot;&gt;
        &lt;div class=&quot;top&quot;&gt;
          &lt;div class=&quot;code&quot;&gt;MODULE ①&lt;/div&gt;
          &lt;h4&gt;AIX 공간기획&amp;amp;도면 &lt;span class=&quot;hrs&quot;&gt;48H&lt;/span&gt;&lt;/h4&gt;

          &lt;div class=&quot;code&quot;&gt;FOUNDATION · &lt;span style=&quot;color:var(--nb-blue)&quot;&gt;추천·권장&lt;/span&gt;&lt;/div&gt;
          &lt;h4&gt;AIX 일러 &lt;span class=&quot;hrs&quot;&gt;24H&lt;/span&gt;&lt;/h4&gt;
          &lt;p class=&quot;tagline&quot;&gt;일러스트 기반 벡터 그래픽·아트웍 툴 기초 (디테일 일러스트 포함)&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;body&quot;&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;대상&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;선수과목 없음 / 전 스튜디오 공통 권장&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;k&quot;&gt;운영&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;24H · 3H×8D · 1개월&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;result-box&quot;&gt;&lt;b&gt;결과물&lt;/b&gt; · 벡터 아트웍·아이콘·심볼 등 기초 실습 결과물&lt;/div&gt;
          &lt;div class=&quot;from&quot;&gt;&lt;b&gt;기존:&lt;/b&gt; 일러스트·디테일 일러스트 → 통합·신설 · &lt;b&gt;추천·권장&lt;/b&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ========== 5. 취업분야별 추천 조합 ========== --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;5&lt;/div&gt;&lt;h2&gt;취업분야별 추천 조합&lt;/h2&gt;&lt;span class=&quot;sub&quot;&gt;단계 패키지 · 진출 영역&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;note-top&quot;&gt;전공 과목은 &lt;b&gt;단계적으로 쌓는 3개 패키지&lt;/b&gt;로 안내합니다 — &lt;b&gt;패키지 1&lt;/b&gt;(공간기획+3D) → &lt;b&gt;패키지 2&lt;/b&gt;(+BIM) → &lt;b&gt;패키지 3&lt;/b&gt;(종합, +VR). AIX 코어·AIX 디자인 코어은 필수가 아닌 &lt;b&gt;공통 추천&lt;/b&gt;으로 함께 권장하며, 각 패키지 이수 후 프로젝트반으로 연결됩니다.&lt;/div&gt;
    &lt;div class=&quot;tbl-scroll&quot;&gt;
      &lt;table class=&quot;combo&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;취업 방향&lt;/th&gt;&lt;th&gt;추천 조합&lt;/th&gt;&lt;th&gt;최종 결과물&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td class=&quot;course&quot;&gt;CAD 도면 설계자 · AI 공간 기획자 · 3D 비주얼라이저&lt;/td&gt;&lt;td class=&quot;path&quot;&gt;&lt;span class=&quot;base&quot;&gt;파운데이션(추천)&lt;/span&gt; + &lt;span class=&quot;mod&quot;&gt;① 공간기획&amp;amp;도면 + ② 3D인테리어&lt;/span&gt; &lt;small&gt;(패키지 1)&lt;/small&gt;&lt;/td&gt;&lt;td&gt;AutoCAD 도면세트(평면·입면·천장) + 주거·상업 공간 고품질 렌더링 포트폴리오&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;course&quot;&gt;BIM 보조 모델러 (설계사무소 Junior)&lt;/td&gt;&lt;td class=&quot;path&quot;&gt;&lt;span class=&quot;base&quot;&gt;패키지 1&lt;/span&gt; + &lt;span class=&quot;mod&quot;&gt;③ BIM 기초 &amp;amp; AIX 활용&lt;/span&gt; &lt;small&gt;(패키지 2)&lt;/small&gt;&lt;/td&gt;&lt;td&gt;패키지 1 결과물 + BIM 모델 · 도면세트(평면·입면·단면) · 수량 산출표&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;course&quot;&gt;VR 투어 프리랜서 (설계~시각화~시공~VR 종합)&lt;/td&gt;&lt;td class=&quot;path&quot;&gt;&lt;span class=&quot;base&quot;&gt;파운데이션(추천)&lt;/span&gt; + &lt;span class=&quot;mod&quot;&gt;①~④ 전체&lt;/span&gt; &lt;small&gt;(패키지 3 · 종합)&lt;/small&gt;&lt;/td&gt;&lt;td&gt;도면 · 렌더링 · BIM · VR을 아우르는 통합 포트폴리오&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;p class=&quot;after&quot;&gt;→ 각 패키지는 마지막에 &lt;b&gt;인테리어 프로젝트반(포폴반)&lt;/b&gt;으로 이어져 실전 통합 포트폴리오로 확장됩니다. (④ VR은 ② 이수가 전제이므로 종합 패키지에 포함)&lt;/p&gt;
  &lt;/section&gt;

  &lt;!-- ========== 6. 기대효과 &amp; 운영 포인트 ========== --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;6&lt;/div&gt;&lt;h2&gt;기대효과 &amp;amp; 운영 포인트&lt;/h2&gt;&lt;/div&gt;
    &lt;div class=&quot;eff-grid&quot;&gt;
      &lt;div class=&quot;eff&quot;&gt;&lt;div class=&quot;ic&quot;&gt;🚪&lt;/div&gt;&lt;h5&gt;진입장벽 ↓&lt;/h5&gt;&lt;p&gt;전공 4과목 전부 완전 초보자 기준, 파운데이션은 추천이라 곧바로 ①부터 시작&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;eff&quot;&gt;&lt;div class=&quot;ic&quot;&gt;🎯&lt;/div&gt;&lt;h5&gt;중도이탈 ↓&lt;/h5&gt;&lt;p&gt;매 과목 Live Brief로 포트폴리오급 납품 결과물 확보 → 완주 동기 강화&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;eff&quot;&gt;&lt;div class=&quot;ic&quot;&gt;🔁&lt;/div&gt;&lt;h5&gt;재등록·업셀 ↑&lt;/h5&gt;&lt;p&gt;과목을 하나씩 추가하며 취업 방향을 완성하는 구조 → 연속 등록 유도&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;eff&quot;&gt;&lt;div class=&quot;ic&quot;&gt;♻️&lt;/div&gt;&lt;h5&gt;자원 손실 없음&lt;/h5&gt;&lt;p&gt;캐드·스케치업·맥스·BIM·AI 수업·강사 자원을 4과목으로 재배치, 자격증·기계 라인 별도 존치&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;eff&quot;&gt;&lt;div class=&quot;ic&quot;&gt;🎓&lt;/div&gt;&lt;h5&gt;상위 연계&lt;/h5&gt;&lt;p&gt;모든 과목이 인테리어 프로젝트반(포폴반)으로 수렴하는 명확한 로드맵&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

<script>
  function fitFrame(f){
    try{
      var d=f.contentDocument||f.contentWindow.document;
      f.style.height=d.documentElement.scrollHeight+'px';
    }catch(e){}
  }
  function showTab(i){
    document.querySelectorAll('.tab-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.tab==String(i));
    });
    document.querySelectorAll('.tab-panel').forEach(function(p,idx){
      p.classList.toggle('active', idx===i);
    });
    var fr=document.querySelector('#panel-'+i+' .doc-frame');
    if(fr) fitFrame(fr);
    window.scrollTo({top:0,behavior:'instant'});
  }
  // 창 크기 변경 시 활성 프레임 높이 재계산
  window.addEventListener('resize', function(){
    var fr=document.querySelector('.tab-panel.active .doc-frame');
    if(fr) fitFrame(fr);
  });
</script>
